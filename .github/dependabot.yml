# Weekly, grouped updates: at most one PR per ecosystem per week.
# Not covered here: the pinned tool versions in ci.yml (golangci-lint, sqlc,
# buf, actionlint) and the protoc-gen-es plugin in buf.gen.yaml; bump those by
# hand together with README.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    groups:
      actions:
        patterns: ["*"]
