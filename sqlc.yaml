version: "2"

# One entry per module: db/queries/<module>.sql generates into that module's
# postgres package, which only the module itself may import (internal/archtest).
# sqlc rejects unknown top-level keys, so each new entry repeats the go options
# below; keep them identical across entries.
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/identity.sql
    gen:
      go:
        package: postgres
        out: internal/identity/postgres
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
