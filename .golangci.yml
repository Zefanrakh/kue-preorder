version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - noctx
    - sqlclosecheck
    - unconvert
  settings:
    # Module boundaries (docs/architecture.md §5). Rules depguard cannot express
    # generically (foreign postgres/ packages, aggregation) live in internal/archtest.
    depguard:
      rules:
        recipe-is-pure:
          files:
            - "**/internal/recipe/**"
          deny:
            - pkg: github.com/Zefanrakh/kue-preorder/internal
              desc: recipe is a pure engine and must not import other internal packages
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.(Now|Since|Until)$
          msg: take the time from an injected clock.Clock (internal/platform/clock)
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: internal/platform/clock/
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Zefanrakh/kue-preorder
