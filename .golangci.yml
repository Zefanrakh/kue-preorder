version: "2"

run:
  build-tags:
    - integration

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - noctx
    - sqlclosecheck
    - unconvert
  settings:
    # Module boundaries (docs/architecture.md §5). Rules depguard cannot express
    # generically (foreign postgres/ packages, aggregation) live in internal/archtest.
    depguard:
      rules:
        # recipe is a pure engine: the standard library, itself, the formula
        # evaluator, and (in tests) the property-testing library. Nothing else,
        # no other internal package and no database or HTTP client.
        recipe-is-pure:
          list-mode: strict
          files:
            - "**/internal/recipe/**"
          allow:
            - $gostd
            - github.com/Zefanrakh/kue-preorder/internal/recipe
            - github.com/expr-lang/expr
            - pgregory.net/rapid
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.(Now|Since|Until)$
          msg: take the time from an injected clock.Clock (internal/platform/clock)
        # The server's zone is not the shop's: business times are Asia/Jakarta.
        - pattern: ^time\.(Local|Time\.Local)$
          msg: use clock.Jakarta (internal/platform/clock), never the server's zone
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: internal/platform/clock/
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Zefanrakh/kue-preorder
