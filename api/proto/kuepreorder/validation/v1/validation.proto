syntax = "proto3";

package kuepreorder.validation.v1;

// FieldErrors travels as a Connect error detail on InvalidArgument (bad
// input) and AlreadyExists (a clash with an existing record): which request
// fields are wrong and why, in words for the person editing. A form marks
// each named field with its message.
message FieldErrors {
  // Request field name (snake_case, as in the request message) to the
  // message to show, in Indonesian.
  map<string, string> fields = 1;
}

// Precondition travels as a Connect error detail on FailedPrecondition: the
// request is fine, but something must happen first.
message Precondition {
  // Stable code the client acts on, such as "phone_required" (send the
  // customer to sign in with WhatsApp) or "too_many_unpaid".
  string reason = 1;
  // What to do, in Indonesian, for the customer.
  string message = 2;
}
